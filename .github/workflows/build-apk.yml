name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Copy offline libraries (peta)
        run: |
          mkdir -p www/lib
          cp -r node_modules/leaflet/dist www/lib/leaflet

      - name: Tanamkan nama repository (untuk update otomatis di aplikasi)
        run: sed -i "s#__REPO__#${{ github.repository }}#" www/app.js

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Add native code (sensor lux, log crash, update, optimasi baterai)
        run: |
          D=android/app/src/main/java/com/bimapalma/sensusblok
          cat > $D/LightSensorPlugin.java <<'JAVAEOF'
          package com.bimapalma.sensusblok;

          import android.content.Context;
          import android.hardware.Sensor;
          import android.hardware.SensorEvent;
          import android.hardware.SensorEventListener;
          import android.hardware.SensorManager;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "LightSensor")
          public class LightSensorPlugin extends Plugin implements SensorEventListener {
              private SensorManager sm;
              private volatile float last = -1f;

              @PluginMethod
              public void start(PluginCall call) {
                  sm = (SensorManager) getContext().getSystemService(Context.SENSOR_SERVICE);
                  Sensor light = sm.getDefaultSensor(Sensor.TYPE_LIGHT);
                  if (light == null) {
                      call.reject("Sensor cahaya tidak tersedia di HP ini");
                      return;
                  }
                  sm.unregisterListener(this);
                  sm.registerListener(this, light, SensorManager.SENSOR_DELAY_UI);
                  call.resolve();
              }

              @PluginMethod
              public void stop(PluginCall call) {
                  if (sm != null) sm.unregisterListener(this);
                  call.resolve();
              }

              @PluginMethod
              public void getLux(PluginCall call) {
                  JSObject o = new JSObject();
                  o.put("available", last >= 0);
                  o.put("lux", (double) last);
                  call.resolve(o);
              }

              @Override
              public void onSensorChanged(SensorEvent e) {
                  last = e.values[0];
              }

              @Override
              public void onAccuracyChanged(Sensor s, int a) {}

              @Override
              protected void handleOnDestroy() {
                  if (sm != null) sm.unregisterListener(this);
              }
          }
          JAVAEOF
          cat > $D/MainActivity.java <<'JAVAEOF'
          package com.bimapalma.sensusblok;

          import android.content.Intent;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(LightSensorPlugin.class);
                  registerPlugin(SensusNativePlugin.class);
                  registerPlugin(PdfMapPlugin.class);
                  SensusNativePlugin.installCrashHandler(this);
                  super.onCreate(savedInstanceState);
                  PdfMapPlugin.handleIntent(this, getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  PdfMapPlugin.handleIntent(this, intent);
              }
          }
          JAVAEOF
          cat > $D/PdfMapPlugin.java <<'JAVAEOF'
          package com.bimapalma.sensusblok;

          import android.app.Activity;
          import android.app.ActivityManager;
          import android.content.Context;
          import android.content.Intent;
          import android.database.Cursor;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.Matrix;
          import android.graphics.pdf.PdfRenderer;
          import android.net.Uri;
          import android.os.Build;
          import android.os.ParcelFileDescriptor;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.provider.OpenableColumns;
          import android.util.Base64;
          import androidx.activity.result.ActivityResult;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.concurrent.Executors;
          import java.util.concurrent.ScheduledExecutorService;
          import java.util.concurrent.TimeUnit;

          /**
           * Impor & render GeoPDF secara native (android.graphics.pdf.PdfRenderer) di thread latar sendiri,
           * sehingga WebView / layar tidak macet (ANR). Semua operasi berjalan berurutan pada satu thread.
           *
           * src = "tmp" (berkas hasil pick) atau id peta (PDF asli yang disimpan untuk render tajam saat zoom).
           */
          @CapacitorPlugin(name = "PdfMap")
          public class PdfMapPlugin extends Plugin {
              private final ScheduledExecutorService ex = Executors.newSingleThreadScheduledExecutor();
              private PdfRenderer rend;
              private ParcelFileDescriptor pfd;
              private String openKey = "";
              private volatile long lastUse = 0;

              // ---- berkas yang dibuka dari aplikasi lain (WhatsApp "Buka dengan" / Bagikan) ----
              private static volatile PdfMapPlugin inst = null;
              private static volatile String pPath = null, pName = null, pMime = null;
              private static volatile long pSize = 0;

              @Override
              public void load() {
                  inst = this;
              }

              /** Dipanggil MainActivity (onCreate / onNewIntent). Menyalin berkas ke penyimpanan aplikasi di thread latar. */
              public static void handleIntent(final Context c, Intent i) {
                  if (i == null) return;
                  String a = i.getAction();
                  Uri u = null;
                  if (Intent.ACTION_VIEW.equals(a)) u = i.getData();
                  else if (Intent.ACTION_SEND.equals(a)) {
                      Object o = i.getParcelableExtra(Intent.EXTRA_STREAM);
                      if (o instanceof Uri) u = (Uri) o;
                  }
                  if (u == null) return;
                  i.setAction(Intent.ACTION_MAIN);   // agar tidak diproses ulang saat activity dibuat ulang
                  i.setData(null);
                  final Uri uri = u;
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              String mime = c.getContentResolver().getType(uri);
                              String name = uri.getLastPathSegment();
                              Cursor q = null;
                              try {
                                  q = c.getContentResolver().query(uri, null, null, null, null);
                                  if (q != null && q.moveToFirst()) {
                                      int k = q.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                                      if (k >= 0 && q.getString(k) != null) name = q.getString(k);
                                  }
                              } catch (Exception e) {
                              } finally {
                                  if (q != null) q.close();
                              }
                              File d = new File(c.getFilesDir(), "pdfmap");
                              d.mkdirs();
                              File out = new File(d, "open_file");
                              long n = 0;
                              InputStream in = c.getContentResolver().openInputStream(uri);
                              if (in == null) return;
                              OutputStream os = new FileOutputStream(out);
                              try {
                                  byte[] b = new byte[262144];
                                  int k;
                                  while ((k = in.read(b)) > 0) {
                                      os.write(b, 0, k);
                                      n += k;
                                  }
                              } finally {
                                  try { os.close(); } catch (Exception e) { }
                                  try { in.close(); } catch (Exception e) { }
                              }
                              pPath = out.getAbsolutePath();
                              pName = name == null ? "berkas" : name;
                              pMime = mime == null ? "" : mime;
                              pSize = n;
                              PdfMapPlugin p = inst;
                              if (p != null) {
                                  JSObject o = new JSObject();
                                  o.put("name", pName);
                                  p.notifyListeners("fileOpened", o);
                              }
                          } catch (Throwable t) {
                          }
                      }
                  }).start();
              }

              @PluginMethod
              public void takeOpened(PluginCall call) {
                  JSObject o = new JSObject();
                  if (pPath != null) {
                      o.put("has", true);
                      o.put("path", pPath);
                      o.put("name", pName);
                      o.put("mime", pMime);
                      o.put("size", pSize);
                      pPath = null;
                  } else {
                      o.put("has", false);
                  }
                  call.resolve(o);
              }

              /** Jadikan berkas yang dibuka sebagai berkas impor peta (src "tmp"). */
              @PluginMethod
              public void adopt(final PluginCall call) {
                  ex.execute(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              closeDoc();
                              File t = fileFor("tmp"), f = new File(dir(), "open_file");
                              if (t.exists()) t.delete();
                              if (!f.renameTo(t)) throw new Exception("Berkas yang dibuka tidak ditemukan.");
                              JSObject o = new JSObject();
                              o.put("path", t.getAbsolutePath());
                              call.resolve(o);
                          } catch (Throwable t) {
                              call.reject(msg(t));
                          }
                      }
                  });
              }

              @PluginMethod
              public void clearOpened(PluginCall call) {
                  new File(dir(), "open_file").delete();
                  call.resolve();
              }

              /** Getar singkat (umpan balik tombol NEXT). */
              @PluginMethod
              public void buzz(PluginCall call) {
                  try {
                      Vibrator v = (Vibrator) getContext().getSystemService(Context.VIBRATOR_SERVICE);
                      int ms = call.getInt("ms", 40);
                      if (v != null && v.hasVibrator()) {
                          if (Build.VERSION.SDK_INT >= 26) v.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE));
                          else v.vibrate(ms);
                      }
                  } catch (Throwable t) {
                  }
                  call.resolve();
              }

              private File dir() {
                  File d = new File(getContext().getFilesDir(), "pdfmap");
                  d.mkdirs();
                  return d;
              }

              private static String clean(String s) {
                  return s == null ? "x" : s.replaceAll("[^A-Za-z0-9_.-]", "_");
              }

              private File fileFor(String src) {
                  return "tmp".equals(src) ? new File(dir(), "import.tmp") : new File(dir(), clean(src) + ".pdf");
              }

              private static String msg(Throwable t) {
                  if (t instanceof OutOfMemoryError) return "Memori HP tidak cukup untuk memproses peta ini.";
                  if (t instanceof SecurityException) return "PDF dilindungi password.";
                  String m = t.getMessage();
                  return (m == null || m.isEmpty()) ? t.toString() : m;
              }

              // Hanya dipanggil dari thread executor.
              private PdfRenderer open(String src) throws Exception {
                  if (rend != null && src.equals(openKey)) return rend;
                  closeDoc();
                  File f = fileFor(src);
                  if (!f.exists()) throw new Exception("Berkas PDF peta tidak ditemukan di penyimpanan aplikasi.");
                  pfd = ParcelFileDescriptor.open(f, ParcelFileDescriptor.MODE_READ_ONLY);
                  try {
                      rend = new PdfRenderer(pfd);
                  } catch (Exception e) {
                      try { pfd.close(); } catch (Exception x) { }
                      pfd = null;
                      throw e;
                  }
                  openKey = src;
                  return rend;
              }

              private void closeDoc() {
                  try { if (rend != null) rend.close(); } catch (Exception e) { }
                  try { if (pfd != null) pfd.close(); } catch (Exception e) { }
                  rend = null;
                  pfd = null;
                  openKey = "";
              }

              private void touch() {
                  lastUse = System.currentTimeMillis();
                  ex.schedule(new Runnable() {
                      @Override
                      public void run() {
                          if (System.currentTimeMillis() - lastUse >= 40000) closeDoc();
                      }
                  }, 45, TimeUnit.SECONDS);
              }

              @PluginMethod
              public void pick(PluginCall call) {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("*/*");
                  i.putExtra(Intent.EXTRA_MIME_TYPES, new String[]{"application/pdf", "image/*"});
                  startActivityForResult(call, i, "pickDone");
              }

              @ActivityCallback
              private void pickDone(final PluginCall call, ActivityResult result) {
                  if (call == null) return;
                  if (result.getResultCode() != Activity.RESULT_OK || result.getData() == null || result.getData().getData() == null) {
                      JSObject o = new JSObject();
                      o.put("cancelled", true);
                      call.resolve(o);
                      return;
                  }
                  final Uri uri = result.getData().getData();
                  final Context c = getContext();
                  ex.execute(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              closeDoc();
                              String mime = c.getContentResolver().getType(uri);
                              String name = "peta";
                              Cursor q = null;
                              try {
                                  q = c.getContentResolver().query(uri, null, null, null, null);
                                  if (q != null && q.moveToFirst()) {
                                      int k = q.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                                      if (k >= 0 && q.getString(k) != null) name = q.getString(k);
                                  }
                              } finally {
                                  if (q != null) q.close();
                              }
                              File out = fileFor("tmp");
                              long n = 0;
                              InputStream in = c.getContentResolver().openInputStream(uri);
                              if (in == null) throw new Exception("Berkas tidak dapat dibuka.");
                              OutputStream os = new FileOutputStream(out);
                              try {
                                  byte[] b = new byte[262144];
                                  int k;
                                  while ((k = in.read(b)) > 0) {
                                      os.write(b, 0, k);
                                      n += k;
                                  }
                              } finally {
                                  try { os.close(); } catch (Exception e) { }
                                  try { in.close(); } catch (Exception e) { }
                              }
                              JSObject o = new JSObject();
                              o.put("path", out.getAbsolutePath());
                              o.put("name", name);
                              o.put("mime", mime == null ? "" : mime);
                              o.put("size", n);
                              call.resolve(o);
                          } catch (Throwable t) {
                              call.reject(msg(t));
                          }
                      }
                  });
              }

              @PluginMethod
              public void info(final PluginCall call) {
                  final String src = call.getString("src", "tmp");
                  final int pg = call.getInt("page", 0);
                  ex.execute(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              PdfRenderer r = open(src);
                              int pages = r.getPageCount();
                              PdfRenderer.Page p = r.openPage(Math.max(0, Math.min(pages - 1, pg)));
                              JSObject o = new JSObject();
                              try {
                                  o.put("w", p.getWidth());
                                  o.put("h", p.getHeight());
                              } finally {
                                  p.close();
                              }
                              o.put("pages", pages);
                              touch();
                              call.resolve(o);
                          } catch (Throwable t) {
                              call.reject(msg(t));
                          }
                      }
                  });
              }

              /**
               * Render wilayah (ox,oy,rw,rh) dari "viewport halaman pada skala kv" ke bitmap ow x oh.
               * Bila "out" diisi hasil ditulis ke berkas JPEG (kembali: path), jika tidak kembali: data (base64 JPEG).
               */
              @PluginMethod
              public void render(final PluginCall call) {
                  final String src = call.getString("src", "tmp");
                  final int pg = call.getInt("page", 0);
                  final double kv = call.getDouble("kv", 1.0);
                  final double ox = call.getDouble("ox", 0.0);
                  final double oy = call.getDouble("oy", 0.0);
                  final double rw = call.getDouble("rw", 1.0);
                  final double rh = call.getDouble("rh", 1.0);
                  final int ow = call.getInt("ow", 512);
                  final int oh = call.getInt("oh", 512);
                  final int q = call.getInt("q", 85);
                  final String out = call.getString("out");
                  ex.execute(new Runnable() {
                      @Override
                      public void run() {
                          Bitmap bmp = null;
                          try {
                              if (ow < 1 || oh < 1 || ow > 8192 || oh > 8192 || rw <= 0 || rh <= 0 || kv <= 0)
                                  throw new Exception("Ukuran render tidak valid.");
                              PdfRenderer r = open(src);
                              bmp = Bitmap.createBitmap(ow, oh, Bitmap.Config.ARGB_8888);
                              bmp.eraseColor(Color.WHITE);
                              Matrix m = new Matrix();
                              m.setScale((float) (kv * ow / rw), (float) (kv * oh / rh));
                              m.postTranslate((float) (-ox * ow / rw), (float) (-oy * oh / rh));
                              PdfRenderer.Page p = r.openPage(Math.max(0, Math.min(r.getPageCount() - 1, pg)));
                              try {
                                  p.render(bmp, null, m, PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY);
                              } finally {
                                  p.close();
                              }
                              JSObject o = new JSObject();
                              o.put("w", ow);
                              o.put("h", oh);
                              if (out != null && !out.isEmpty()) {
                                  File f = new File(dir(), clean(out));
                                  FileOutputStream fo = new FileOutputStream(f);
                                  try {
                                      bmp.compress(Bitmap.CompressFormat.JPEG, q, fo);
                                  } finally {
                                      fo.close();
                                  }
                                  o.put("path", f.getAbsolutePath());
                              } else {
                                  ByteArrayOutputStream bo = new ByteArrayOutputStream(65536);
                                  bmp.compress(Bitmap.CompressFormat.JPEG, q, bo);
                                  o.put("data", Base64.encodeToString(bo.toByteArray(), Base64.NO_WRAP));
                              }
                              touch();
                              call.resolve(o);
                          } catch (Throwable t) {
                              call.reject(msg(t));
                          } finally {
                              if (bmp != null) bmp.recycle();
                          }
                      }
                  });
              }

              /** Simpan PDF hasil pick sebagai PDF peta (untuk render tajam saat zoom). */
              @PluginMethod
              public void save(final PluginCall call) {
                  final String id = call.getString("id", "peta");
                  ex.execute(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              closeDoc();
                              File t = fileFor("tmp"), d = fileFor(id);
                              if (d.exists()) d.delete();
                              if (!t.renameTo(d)) throw new Exception("Gagal menyimpan PDF peta.");
                              call.resolve();
                          } catch (Throwable t) {
                              call.reject(msg(t));
                          }
                      }
                  });
              }

              @PluginMethod
              public void remove(final PluginCall call) {
                  final String id = call.getString("id", "");
                  ex.execute(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              if (id.length() > 0) {
                                  if (id.equals(openKey)) closeDoc();
                                  fileFor(id).delete();
                              }
                              call.resolve();
                          } catch (Throwable t) {
                              call.reject(msg(t));
                          }
                      }
                  });
              }

              /** Hapus berkas sementara (hasil pick & gambar sementara). */
              @PluginMethod
              public void cleanup(final PluginCall call) {
                  ex.execute(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              if ("tmp".equals(openKey)) closeDoc();
                              File[] fs = dir().listFiles();
                              if (fs != null) for (File f : fs) {
                                  String n = f.getName();
                                  if (n.equals("import.tmp") || n.startsWith("base_") || n.startsWith("page_")) f.delete();
                              }
                              call.resolve();
                          } catch (Throwable t) {
                              call.reject(msg(t));
                          }
                      }
                  });
              }

              @PluginMethod
              public void memInfo(PluginCall call) {
                  ActivityManager am = (ActivityManager) getContext().getSystemService(Context.ACTIVITY_SERVICE);
                  JSObject o = new JSObject();
                  o.put("memClass", am.getMemoryClass());
                  o.put("lowRam", am.isLowRamDevice());
                  call.resolve(o);
              }

              @Override
              protected void handleOnDestroy() {
                  ex.execute(new Runnable() {
                      @Override
                      public void run() {
                          closeDoc();
                      }
                  });
              }
          }
          JAVAEOF
          cat > $D/SensusNativePlugin.java <<'JAVAEOF'
          package com.bimapalma.sensusblok;

          import android.app.ActivityManager;
          import android.app.ApplicationExitInfo;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.PowerManager;
          import android.provider.Settings;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.FileWriter;
          import java.io.InputStream;
          import java.io.PrintWriter;
          import java.io.RandomAccessFile;
          import java.io.StringWriter;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.Date;
          import java.util.List;

          @CapacitorPlugin(name = "SensusNative")
          public class SensusNativePlugin extends Plugin {
              static volatile long dlDone = 0;
              static volatile long dlTotal = 0;
              static volatile String dlState = "idle";
              static volatile String dlErr = "";

              public static void installCrashHandler(final Context ctx) {
                  final Thread.UncaughtExceptionHandler old = Thread.getDefaultUncaughtExceptionHandler();
                  Thread.setDefaultUncaughtExceptionHandler(new Thread.UncaughtExceptionHandler() {
                      @Override
                      public void uncaughtException(Thread t, Throwable e) {
                          try {
                              StringWriter sw = new StringWriter();
                              e.printStackTrace(new PrintWriter(sw));
                              File f = new File(ctx.getFilesDir(), "crash.log");
                              if (f.exists() && f.length() > 200000) f.delete();
                              FileWriter w = new FileWriter(f, true);
                              w.write("=== CRASH " + System.currentTimeMillis() + " | " + new Date() + " thread=" + t.getName() + " ===\n" + sw + "\n");
                              w.close();
                          } catch (Throwable x) {
                          }
                          if (old != null) old.uncaughtException(t, e);
                      }
                  });
              }

              private static String readTail(File f, int max) {
                  try {
                      if (!f.exists()) return "";
                      RandomAccessFile r = new RandomAccessFile(f, "r");
                      long len = r.length();
                      long start = Math.max(0L, len - max);
                      r.seek(start);
                      byte[] b = new byte[(int) (len - start)];
                      r.readFully(b);
                      r.close();
                      return new String(b, "UTF-8");
                  } catch (Exception e) {
                      return "(gagal membaca: " + e + ")";
                  }
              }

              private static String reasonName(int r) {
                  switch (r) {
                      case 1: return "EXIT_SELF";
                      case 2: return "SIGNALED";
                      case 3: return "LOW_MEMORY";
                      case 4: return "CRASH";
                      case 5: return "CRASH_NATIVE";
                      case 6: return "ANR";
                      case 7: return "INITIALIZATION_FAILURE";
                      case 8: return "PERMISSION_CHANGE";
                      case 9: return "EXCESSIVE_RESOURCE_USAGE";
                      case 10: return "USER_REQUESTED";
                      case 11: return "USER_STOPPED";
                      case 12: return "DEPENDENCY_DIED";
                      case 13: return "OTHER";
                      case 14: return "FREEZER";
                      case 15: return "PACKAGE_STATE_CHANGE";
                      case 16: return "PACKAGE_UPDATED";
                      default: return String.valueOf(r);
                  }
              }

              @PluginMethod
              public void getInfo(PluginCall call) {
                  JSObject o = new JSObject();
                  Context c = getContext();
                  try {
                      PackageInfo pi = c.getPackageManager().getPackageInfo(c.getPackageName(), 0);
                      o.put("versionName", pi.versionName);
                      o.put("versionCode", Build.VERSION.SDK_INT >= 28 ? pi.getLongVersionCode() : (long) pi.versionCode);
                  } catch (Exception e) {
                  }
                  o.put("sdk", Build.VERSION.SDK_INT);
                  o.put("model", Build.MANUFACTURER + " " + Build.MODEL);
                  o.put("brand", Build.MANUFACTURER);
                  PowerManager pm = (PowerManager) c.getSystemService(Context.POWER_SERVICE);
                  o.put("ignoringBattery", Build.VERSION.SDK_INT < 23 || pm.isIgnoringBatteryOptimizations(c.getPackageName()));
                  o.put("canInstall", Build.VERSION.SDK_INT < 26 || c.getPackageManager().canRequestPackageInstalls());
                  ActivityManager am = (ActivityManager) c.getSystemService(Context.ACTIVITY_SERVICE);
                  ActivityManager.MemoryInfo mi = new ActivityManager.MemoryInfo();
                  am.getMemoryInfo(mi);
                  o.put("totalMem", mi.totalMem);
                  o.put("availMem", mi.availMem);
                  o.put("lowMem", mi.lowMemory);
                  call.resolve(o);
              }

              @PluginMethod
              public void readLog(PluginCall call) {
                  JSObject o = new JSObject();
                  o.put("crash", readTail(new File(getContext().getFilesDir(), "crash.log"), 60000));
                  StringBuilder sb = new StringBuilder();
                  if (Build.VERSION.SDK_INT >= 30) {
                      try {
                          ActivityManager am = (ActivityManager) getContext().getSystemService(Context.ACTIVITY_SERVICE);
                          List<ApplicationExitInfo> l = am.getHistoricalProcessExitReasons(getContext().getPackageName(), 0, 12);
                          for (ApplicationExitInfo i : l) {
                              sb.append(i.getTimestamp()).append(" | ").append(new Date(i.getTimestamp())).append(" | reason=").append(reasonName(i.getReason()))
                                .append("  status=").append(i.getStatus()).append("  importance=").append(i.getImportance())
                                .append("  ").append(i.getDescription()).append("\n");
                          }
                      } catch (Exception e) {
                          sb.append("(gagal membaca exit info: ").append(e).append(")\n");
                      }
                  }
                  o.put("exits", sb.toString());
                  call.resolve(o);
              }

              @PluginMethod
              public void clearLog(PluginCall call) {
                  new File(getContext().getFilesDir(), "crash.log").delete();
                  call.resolve();
              }

              private void launch(Intent i) {
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  getContext().startActivity(i);
              }

              @PluginMethod
              public void requestIgnoreBattery(PluginCall call) {
                  try {
                      launch(new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:" + getContext().getPackageName())));
                  } catch (Exception e) {
                      try {
                          launch(new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS));
                      } catch (Exception e2) {
                      }
                  }
                  call.resolve();
              }

              @PluginMethod
              public void openBatterySettings(PluginCall call) {
                  try {
                      launch(new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS));
                  } catch (Exception e) {
                  }
                  call.resolve();
              }

              @PluginMethod
              public void openAppSettings(PluginCall call) {
                  try {
                      launch(new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + getContext().getPackageName())));
                  } catch (Exception e) {
                  }
                  call.resolve();
              }

              @PluginMethod
              public void download(final PluginCall call) {
                  final String url = call.getString("url");
                  final String token = call.getString("token");
                  dlDone = 0;
                  dlTotal = 0;
                  dlState = "run";
                  dlErr = "";
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              String u = url;
                              HttpURLConnection c;
                              int hops = 0;
                              while (true) {
                                  c = (HttpURLConnection) new URL(u).openConnection();
                                  c.setInstanceFollowRedirects(false);
                                  c.setConnectTimeout(15000);
                                  c.setReadTimeout(30000);
                                  c.setRequestProperty("Accept", "application/octet-stream");
                                  c.setRequestProperty("User-Agent", "SensusBlok");
                                  if (token != null && token.length() > 0 && u.startsWith("https://api.github.com")) {
                                      c.setRequestProperty("Authorization", "Bearer " + token);
                                  }
                                  int code = c.getResponseCode();
                                  if (code >= 300 && code < 400 && hops++ < 6) {
                                      u = c.getHeaderField("Location");
                                      c.disconnect();
                                      continue;
                                  }
                                  if (code != 200) throw new Exception("HTTP " + code);
                                  break;
                              }
                              dlTotal = c.getContentLengthLong();
                              File f = new File(getContext().getCacheDir(), "update.apk");
                              InputStream in = c.getInputStream();
                              FileOutputStream out = new FileOutputStream(f);
                              byte[] buf = new byte[65536];
                              int n;
                              while ((n = in.read(buf)) > 0) {
                                  out.write(buf, 0, n);
                                  dlDone += n;
                              }
                              out.close();
                              in.close();
                              dlState = "ok";
                              JSObject r = new JSObject();
                              r.put("size", dlDone);
                              call.resolve(r);
                          } catch (Exception e) {
                              dlState = "err";
                              dlErr = String.valueOf(e);
                              call.reject("Unduh gagal: " + e);
                          }
                      }
                  }).start();
              }

              @PluginMethod
              public void dlStatus(PluginCall call) {
                  JSObject o = new JSObject();
                  o.put("done", dlDone);
                  o.put("total", dlTotal);
                  o.put("state", dlState);
                  o.put("err", dlErr);
                  call.resolve(o);
              }

              @PluginMethod
              public void installApk(PluginCall call) {
                  Context c = getContext();
                  try {
                      File f = new File(c.getCacheDir(), "update.apk");
                      if (!f.exists()) {
                          call.reject("Berkas update tidak ditemukan");
                          return;
                      }
                      JSObject o = new JSObject();
                      if (Build.VERSION.SDK_INT >= 26 && !c.getPackageManager().canRequestPackageInstalls()) {
                          launch(new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + c.getPackageName())));
                          o.put("needPermission", true);
                          call.resolve(o);
                          return;
                      }
                      Uri uri = FileProvider.getUriForFile(c, c.getPackageName() + ".fileprovider", f);
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(uri, "application/vnd.android.package-archive");
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      launch(i);
                      call.resolve(o);
                  } catch (Exception e) {
                      call.reject("Gagal memulai pemasangan: " + e);
                  }
              }
          }
          JAVAEOF

      - name: Generate app icons
        run: npx @capacitor/assets generate --android

      - name: Izin di AndroidManifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION REQUEST_INSTALL_PACKAGES REQUEST_IGNORE_BATTERY_OPTIMIZATIONS VIBRATE; do
            sed -i "/<application/i \    <uses-permission android:name=\"android.permission.$P\" />" $M
          done
          grep -n "uses-permission" $M
          # "Buka dengan" / Bagikan dari WhatsApp & aplikasi lain (GeoPDF, gambar, backup, data tim, layer GIS)
          cat > /tmp/filters.xml <<'XMLEOF'
          <intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><data android:scheme="content"/><data android:scheme="file"/><data android:mimeType="application/pdf"/><data android:mimeType="image/*"/><data android:mimeType="application/json"/><data android:mimeType="application/zip"/><data android:mimeType="application/x-zip-compressed"/><data android:mimeType="application/octet-stream"/><data android:mimeType="application/vnd.google-earth.kml+xml"/><data android:mimeType="application/vnd.google-earth.kmz"/><data android:mimeType="application/gpx+xml"/><data android:mimeType="application/geo+json"/><data android:mimeType="text/csv"/><data android:mimeType="text/comma-separated-values"/><data android:mimeType="text/xml"/><data android:mimeType="application/xml"/><data android:mimeType="text/plain"/></intent-filter><intent-filter><action android:name="android.intent.action.SEND"/><category android:name="android.intent.category.DEFAULT"/><data android:mimeType="application/pdf"/><data android:mimeType="image/*"/><data android:mimeType="application/json"/><data android:mimeType="application/zip"/><data android:mimeType="application/x-zip-compressed"/><data android:mimeType="application/octet-stream"/><data android:mimeType="application/vnd.google-earth.kml+xml"/><data android:mimeType="application/vnd.google-earth.kmz"/><data android:mimeType="application/gpx+xml"/><data android:mimeType="application/geo+json"/><data android:mimeType="text/csv"/><data android:mimeType="text/comma-separated-values"/><data android:mimeType="text/xml"/><data android:mimeType="application/xml"/><data android:mimeType="text/plain"/></intent-filter>
          XMLEOF
          python3 - <<'PYEOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          i = s.index('</activity>')
          open(p, 'w', encoding='utf-8').write(s[:i] + open('/tmp/filters.xml', encoding='utf-8').read() + s[i:])
          PYEOF
          grep -c "intent-filter" $M

      - name: Kunci penandatangan tetap + nomor versi (agar update tidak perlu uninstall)
        run: |
          echo "" | base64 -d > android/sensusblok.keystore
          cat > android/app/signing.gradle <<'EOF'
          android {
              signingConfigs {
                  sensus {
                      storeFile file("${rootDir}/sensusblok.keystore")
                      storeType 'pkcs12'
                      storePassword 'sensusblok'
                      keyAlias 'sensusblok'
                      keyPassword 'sensusblok'
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.sensus }
              }
          }
          EOF
          echo "apply from: 'signing.gradle'" >> android/app/build.gradle
          sed -i 's/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName "1.0"/versionName "2.0"/' android/app/build.gradle

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SensusBlok-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Siapkan berkas rilis
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SensusBlok-build${{ github.run_number }}.apk

      - name: Publikasikan rilis (dipakai fitur update otomatis)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Sensus Blok build ${{ github.run_number }} (v2.0)
          body: ${{ github.event.head_commit.message || 'Pembaruan aplikasi' }}
          files: SensusBlok-build${{ github.run_number }}.apk
          make_latest: true
