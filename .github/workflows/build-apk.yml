name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Copy offline libraries (peta & PDF)
        run: |
          mkdir -p www/lib
          cp -r node_modules/leaflet/dist www/lib/leaflet
          cp node_modules/pdfjs-dist/legacy/build/pdf.min.mjs www/lib/pdf.js || cp node_modules/pdfjs-dist/legacy/build/pdf.mjs www/lib/pdf.js
          cp node_modules/pdfjs-dist/legacy/build/pdf.worker.min.mjs www/lib/pdf.worker.js || cp node_modules/pdfjs-dist/legacy/build/pdf.worker.mjs www/lib/pdf.worker.js
          cp -r node_modules/pdfjs-dist/standard_fonts www/lib/standard_fonts
          cp -r node_modules/pdfjs-dist/cmaps www/lib/cmaps

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Add native code (lux sensor)
        run: |
          D=android/app/src/main/java/com/bimapalma/sensusblok
          cat > $D/LightSensorPlugin.java <<'EOF'
          package com.bimapalma.sensusblok;

          import android.content.Context;
          import android.hardware.Sensor;
          import android.hardware.SensorEvent;
          import android.hardware.SensorEventListener;
          import android.hardware.SensorManager;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "LightSensor")
          public class LightSensorPlugin extends Plugin implements SensorEventListener {
              private SensorManager sm;
              private volatile float last = -1f;

              @PluginMethod
              public void start(PluginCall call) {
                  sm = (SensorManager) getContext().getSystemService(Context.SENSOR_SERVICE);
                  Sensor light = sm.getDefaultSensor(Sensor.TYPE_LIGHT);
                  if (light == null) {
                      call.reject("Sensor cahaya tidak tersedia di HP ini");
                      return;
                  }
                  sm.unregisterListener(this);
                  sm.registerListener(this, light, SensorManager.SENSOR_DELAY_UI);
                  call.resolve();
              }

              @PluginMethod
              public void stop(PluginCall call) {
                  if (sm != null) sm.unregisterListener(this);
                  call.resolve();
              }

              @PluginMethod
              public void getLux(PluginCall call) {
                  JSObject o = new JSObject();
                  o.put("available", last >= 0);
                  o.put("lux", (double) last);
                  call.resolve(o);
              }

              @Override
              public void onSensorChanged(SensorEvent e) {
                  last = e.values[0];
              }

              @Override
              public void onAccuracyChanged(Sensor s, int a) {}

              @Override
              protected void handleOnDestroy() {
                  if (sm != null) sm.unregisterListener(this);
              }
          }
          EOF
          cat > $D/MainActivity.java <<'EOF'
          package com.bimapalma.sensusblok;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(LightSensorPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: Generate app icons
        run: npx @capacitor/assets generate --android

      - name: Add location permissions
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SensusBlok-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
