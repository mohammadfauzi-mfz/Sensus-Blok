<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sensus Blok</title>
<link rel="stylesheet" href="lib/leaflet/leaflet.css">
<style>
:root{--g:#2e7d32;--r:#c62828;--bg:#f2f5f0;--t:#1b1f1a;--m:#6b7569}
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:90px}
header{background:var(--g);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 12px 12px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1}
header small{display:block;font-weight:400;font-size:12px;opacity:.85}
header button{background:none;border:0;color:#fff;font-size:24px;padding:4px 8px}
main{padding:12px;max-width:640px;margin:auto}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
label{display:block;font-size:13px;color:var(--m);margin:10px 0 4px}
input,select{width:100%;padding:11px;border:1px solid #c5ccc3;border-radius:8px;font:inherit;background:#fff}
textarea{width:100%;min-height:110px;padding:11px;border:1px solid #c5ccc3;border-radius:8px;font:inherit}
.opt{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #c5ccc3;border-radius:8px;margin:6px 0;color:var(--t);font-size:16px}
.opt input{width:auto}
.b{padding:12px 16px;border:0;border-radius:10px;font:inherit;font-weight:600;color:#fff;background:var(--g)}
.b:disabled{background:#b0b8ae}
.gray{background:#78857a}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.row .b{flex:1}
.bar{position:fixed;left:0;right:0;bottom:0;display:none;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;box-shadow:0 -2px 6px #0003}
.bar .b{flex:1;padding:16px;font-size:17px}
.chip{padding:8px 12px;border-radius:20px;font-weight:600;display:inline-block}
.ok{background:#c8e6c9;color:#1b5e20}
.bad{background:#ffe0b2;color:#e65100}
table{width:100%;border-collapse:collapse;margin-top:8px}
td{padding:6px 4px;border-bottom:1px solid #e3e8e1;font-size:14px}
.r{text-align:right;font-weight:600}
.m{color:var(--m);font-size:13px;white-space:pre-line}
.item{padding:10px 0;border-bottom:1px solid #e3e8e1;display:flex;gap:8px;align-items:center;font-size:14px}
.item span{flex:1}
.item button{padding:8px 12px}
h2{margin:0 0 4px}
.center{text-align:center}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:0;border-radius:10px;background:#dfe6dc;font:inherit;font-weight:600;color:var(--t)}
.tabs .on{background:var(--g);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cell{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px #0002}
.cell img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#ddd}
.cap{padding:6px 8px;font-size:12px}
.pv{width:100%;border-radius:8px;margin-top:8px}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlg{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:420px}
.dlg p{margin:0 0 14px}
.dbt{display:flex;gap:8px}
.dbt .b{flex:1;padding:10px 8px;font-size:13px}
.dbt .b:first-child{flex:0 0 auto;padding:10px 14px}
.fr{border:1px solid #dfe6dc;border-radius:10px;padding:10px;margin-top:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g2 label{margin:6px 0 2px}
.ph{font-size:17px;background:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px #0006}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle}
.leaflet-popup-content{font-size:13px;line-height:1.35}
summary{font-weight:600;padding:4px 0}
.scl{background:#fffd;border:2px solid #333;border-top:none;font-size:11px;padding:0 4px;box-sizing:border-box;white-space:nowrap;margin:0 0 6px 6px}
.lyl{background:#fffc;border:0;box-shadow:none;font-weight:700;font-size:11px;padding:0 3px}
.tabs{display:flex;gap:0;margin:-12px -12px 0;background:#fff;border-bottom:1px solid #d5ddd2}
.tabs button{flex:1;background:none;border:0;border-radius:0;padding:15px 4px;font:inherit;font-weight:600;color:#555;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs .on{color:var(--g);border-bottom-color:var(--g);background:none}
.stabs{display:flex;margin:0 -12px 10px;background:#fff;border-bottom:1px solid #d5ddd2}
.stabs button{flex:1;background:none;border:0;padding:12px 4px;font:inherit;color:#555;border-bottom:3px solid transparent;margin-bottom:-1px}
.stabs .on{color:var(--g);font-weight:700;border-bottom-color:var(--g)}
.flush{padding:0!important;max-width:none!important}
.flush .tabs{margin:0}.flush .stabs{margin:0}
header{z-index:1500}
header .ib{width:40px;height:40px;border-radius:50%;border:1.5px solid #ffffff88;display:flex;align-items:center;justify-content:center;padding:0;margin-left:2px}
header .ib svg{width:22px;height:22px;fill:#fff}
header h1{font-size:19px;letter-spacing:.3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:block;width:calc(100% - 24px);margin:10px 12px;padding:12px 14px;border:1.5px solid #c5ccc3;border-radius:24px;background:#fff;color:var(--g);font:inherit;font-weight:600;text-align:center}
.sl{background:#eef4ec;padding:8px 14px;font-size:13px;line-height:1.4}
.fab{position:absolute;right:10px;top:76px;display:flex;flex-direction:column;gap:8px;z-index:1100}
.fab button{width:46px;height:46px;border-radius:50%;border:0;background:#fffe;box-shadow:0 1px 6px #0004;font-size:21px;color:#333;padding:0}
.crs{position:absolute;left:8px;top:8px;z-index:1100;text-align:center;pointer-events:none}
.crst{font-size:11px;font-weight:700;background:#fffd;border-radius:8px;margin-top:-6px;padding:0 5px;display:inline-block}
.hb{position:absolute;left:78px;right:70px;top:10px;z-index:1100;background:#000b;color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;text-align:center}
.lgo{position:absolute;left:8px;bottom:36px;z-index:1100;background:#fffd;border-radius:8px;padding:4px 8px;font-size:11px;max-width:62%;display:none}
.mtp{position:fixed;left:8px;right:8px;bottom:86px;z-index:1400;background:#fff;border-radius:14px;padding:10px;box-shadow:0 2px 14px #0006}
.bar{z-index:1500}
.bar .o{flex:1;padding:13px 2px;font:inherit;font-weight:600;color:var(--g);background:#fff;border:1.5px solid #c5ccc3;border-radius:24px}
.bar .o:active{background:#eef4ec}
.ov{z-index:3000}
.ov.sh{align-items:flex-end;padding:0}
.sheet{max-width:none;border-radius:18px 18px 0 0;max-height:84vh;overflow:auto;width:100%}
.shh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.px .leaflet-tile{image-rendering:pixelated}
</style>
</head>
<body>
<header id="hd"></header>
<main id="app"></main>
<div id="bar" class="bar"></div>
<script src="lib/leaflet/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
